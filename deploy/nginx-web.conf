# Optional reverse-proxy in front of Astro Node SSR (not used by default Dockerfile.web).
# Point upstream to web:4321 when terminating TLS at nginx.
upstream varka_web {
  server web:4321;
}

server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;

  location / {
    proxy_pass http://varka_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
